    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css">

<body>
    <div id="header-fixed">
        <div id="title" onclick="window.location.href='index.html'">NianDong Liu Portfolio</div>
        <div id="links">

            <a href="otherworks.html" class="active" style="margin:0px 60px;">Other Works</a>
            <a href="about.html">About Me</a>
        </div>

    <div id="page-content">
        <div class="games-grid-container">
            <!-- Other Works Thumbnails Gallery -->
            <div class="game-thumbnails-grid otherworks-grid">
                <div class="game-card" onclick="window.location.href='simple-design.html'">
                    <div class="game-card-image">
                        <img src="images/Simple Design2.jpg" alt="Simple Design">
                    </div>
                    <div class="game-card-info">

                    </div>
                </div>

                    <div class="game-card-image">
                        <img src="images/Theather.jpg" alt="Theater">

                    <div class="game-card-info">

        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-icon">⚠️</div>
            <h3 id="modal-title">Notice</h3>
            <p id="modal-message"></p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
